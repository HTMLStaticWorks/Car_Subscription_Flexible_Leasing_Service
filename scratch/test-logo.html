<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Logo Vector Refinement</title>
  <style>
    body {
      background: #1e222b;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 30px;
      align-items: center;
    }
    .preview-row {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .box {
      padding: 24px 32px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .box-light {
      background: #F5F2ED;
      color: #111;
      border: 1px solid #D8D4CE;
    }
    .box-dark {
      background: #111111;
      color: #fff;
      border: 1px solid #333333;
    }
    .nav-preview {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }
    .brand-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 2px;
      line-height: 1;
    }
    .brand-sub {
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #F26A21;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <h2>ORVEXA SVG Logo in Orange</h2>

  <div class="preview-row">
    <!-- LIGHT THEME -->
    <div class="box box-light">
      <div class="nav-preview">
        <!-- SVG EMBLEM -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="56" height="56" fill="none">
          <defs>
            <linearGradient id="arrow-grad-light" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#E65100" />
              <stop offset="35%" stop-color="#F26A21" />
              <stop offset="85%" stop-color="#FF7A2F" />
              <stop offset="100%" stop-color="#FFA043" />
            </linearGradient>
            <linearGradient id="road-surf-light" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FF8C38" />
              <stop offset="60%" stop-color="#F26A21" />
              <stop offset="100%" stop-color="#D84315" />
            </linearGradient>
            <linearGradient id="road-under-light" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0A111E" />
              <stop offset="70%" stop-color="#141E30" />
              <stop offset="100%" stop-color="#1E2A38" />
            </linearGradient>
          </defs>

          <!-- 1. Road Underbelly Ribbon (Dark Navy/Slate base curving along the bottom circle) -->
          <path d="M 48 128
                   C 42 148 55 174 86 186
                   C 114 195 146 188 165 168
                   C 176 156 174 142 163 135
                   C 148 124 116 135 96 144
                   C 72 155 54 165 44 176
                   C 36 160 38 144 48 128 Z"
                fill="url(#road-under-light)" />

          <!-- White accent curve tracing bottom boundary of road -->
          <path d="M 68 184 C 95 192 125 188 146 176" 
                stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9" />

          <!-- 2. Circular Swooping Arrow (Orange Gradient) -->
          <!-- Sweeps from lower-left (46, 134) up clockwise over the car to (174, 88) -->
          <path d="M 48 132
                   C 36 104 42 68 68 46
                   C 90 27 122 28 145 42
                   C 152 46 158 52 164 58
                   L 152 66
                   L 178 82
                   L 168 50
                   L 158 58
                   C 151 49 141 42 130 36
                   C 102 24 70 28 48 49
                   C 26 71 21 104 32 132
                   Z"
                fill="url(#arrow-grad-light)" />

          <!-- 3. Road Surface (Front Loop in Vibrant Orange) -->
          <path d="M 60 137
                   C 76 138 102 148 130 157
                   C 156 165 172 160 172 148
                   C 172 136 146 137 118 144
                   C 92 151 72 160 54 174
                   C 58 160 70 146 90 142
                   L 60 137 Z"
                fill="url(#road-surf-light)" />

          <!-- Road White Dashed Lane Dividers -->
          <path d="M 72 143 L 86 146" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
          <path d="M 98 149 L 116 154" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" />
          <path d="M 128 156 L 148 158" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />

          <!-- 4. The Sports Car (Front 3/4 perspective, dark body with white highlights & orange details) -->
          <!-- Main Car Silhouette -->
          <path d="M 54 122
                   C 55 111 59 103 66 96
                   C 77 87 92 82 108 81
                   C 123 80 138 84 150 90
                   C 158 94 166 99 172 106
                   C 176 110 176 115 173 119
                   C 170 124 163 127 154 128
                   C 134 130 115 129 96 128
                   C 82 127 68 127 54 122 Z"
                fill="#0F172A" />

          <!-- Cabin Glass & Roofline Highlight -->
          <path d="M 80 97
                   C 87 89 99 85 114 85
                   C 128 85 140 90 148 97
                   L 116 97 Z"
                fill="#FFFFFF" />
          <path d="M 85 96
                   C 90 91 100 88 111 88
                   L 112 96 Z"
                fill="#0A0E17" />
          <!-- Steering wheel / cockpit glow -->
          <path d="M 120 95 C 122 92 126 91 130 93" stroke="#F26A21" stroke-width="1.8" stroke-linecap="round" fill="none" />

          <!-- Sleek Shoulder Line Highlight -->
          <path d="M 60 113
                   C 74 111 90 112 106 111
                   C 124 110 144 111 160 116
                   L 168 118
                   C 158 121 144 119 128 118
                   C 106 117 84 117 64 119 Z"
                fill="#FFFFFF" opacity="0.9" />

          <!-- Front LED Headlight Accent -->
          <path d="M 148 108 L 167 111 L 158 114 L 146 111 Z" fill="#FFFFFF" />
          <path d="M 152 109 L 165 111 L 157 113 Z" fill="url(#arrow-grad-light)" />

          <!-- Grille Lines -->
          <path d="M 154 117 L 169 118" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
          <path d="M 152 121 L 167 121" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />

          <!-- Rear Wheel (3/4 Perspective) -->
          <ellipse cx="69" cy="120" rx="9" ry="12" fill="#0A0E17" stroke="#FFFFFF" stroke-width="2.5" />
          <ellipse cx="69" cy="120" rx="4.5" ry="6.5" fill="url(#arrow-grad-light)" />

          <!-- Front Wheel (Larger Perspective Ellipse) -->
          <ellipse cx="129" cy="122" rx="11" ry="15" fill="#0A0E17" stroke="#FFFFFF" stroke-width="3" />
          <ellipse cx="129" cy="122" rx="5.5" ry="8" fill="url(#arrow-grad-light)" />
        </svg>

        <!-- WEBSITE NAME (NOT REMOVED OR CHANGED) -->
        <div>
          <div class="brand-title">ORVEXA</div>
          <div class="brand-sub">CAR SUBSCRIPTION</div>
        </div>
      </div>
    </div>

    <!-- DARK THEME -->
    <div class="box box-dark">
      <div class="nav-preview">
        <!-- SVG EMBLEM -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="56" height="56" fill="none">
          <defs>
            <linearGradient id="arrow-grad-dark" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#E65100" />
              <stop offset="35%" stop-color="#F26A21" />
              <stop offset="85%" stop-color="#FF7A2F" />
              <stop offset="100%" stop-color="#FFA043" />
            </linearGradient>
            <linearGradient id="road-surf-dark" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FF8C38" />
              <stop offset="60%" stop-color="#F26A21" />
              <stop offset="100%" stop-color="#D84315" />
            </linearGradient>
            <linearGradient id="road-under-dark" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#050911" />
              <stop offset="70%" stop-color="#0E1624" />
              <stop offset="100%" stop-color="#1A2535" />
            </linearGradient>
          </defs>

          <!-- 1. Road Underbelly Ribbon -->
          <path d="M 48 128
                   C 42 148 55 174 86 186
                   C 114 195 146 188 165 168
                   C 176 156 174 142 163 135
                   C 148 124 116 135 96 144
                   C 72 155 54 165 44 176
                   C 36 160 38 144 48 128 Z"
                fill="url(#road-under-dark)" />

          <!-- White accent curve tracing bottom boundary of road -->
          <path d="M 68 184 C 95 192 125 188 146 176" 
                stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9" />

          <!-- 2. Circular Swooping Arrow (Orange Gradient) -->
          <path d="M 48 132
                   C 36 104 42 68 68 46
                   C 90 27 122 28 145 42
                   C 152 46 158 52 164 58
                   L 152 66
                   L 178 82
                   L 168 50
                   L 158 58
                   C 151 49 141 42 130 36
                   C 102 24 70 28 48 49
                   C 26 71 21 104 32 132
                   Z"
                fill="url(#arrow-grad-dark)" />

          <!-- 3. Road Surface (Front Loop in Vibrant Orange) -->
          <path d="M 60 137
                   C 76 138 102 148 130 157
                   C 156 165 172 160 172 148
                   C 172 136 146 137 118 144
                   C 92 151 72 160 54 174
                   C 58 160 70 146 90 142
                   L 60 137 Z"
                fill="url(#road-surf-dark)" />

          <!-- Road White Dashed Lane Dividers -->
          <path d="M 72 143 L 86 146" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
          <path d="M 98 149 L 116 154" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" />
          <path d="M 128 156 L 148 158" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />

          <!-- 4. The Sports Car -->
          <path d="M 54 122
                   C 55 111 59 103 66 96
                   C 77 87 92 82 108 81
                   C 123 80 138 84 150 90
                   C 158 94 166 99 172 106
                   C 176 110 176 115 173 119
                   C 170 124 163 127 154 128
                   C 134 130 115 129 96 128
                   C 82 127 68 127 54 122 Z"
                fill="#0F172A" />

          <!-- Cabin Glass & Roofline Highlight -->
          <path d="M 80 97
                   C 87 89 99 85 114 85
                   C 128 85 140 90 148 97
                   L 116 97 Z"
                fill="#FFFFFF" />
          <path d="M 85 96
                   C 90 91 100 88 111 88
                   L 112 96 Z"
                fill="#0A0E17" />
          <path d="M 120 95 C 122 92 126 91 130 93" stroke="#F26A21" stroke-width="1.8" stroke-linecap="round" fill="none" />

          <!-- Sleek Shoulder Line Highlight -->
          <path d="M 60 113
                   C 74 111 90 112 106 111
                   C 124 110 144 111 160 116
                   L 168 118
                   C 158 121 144 119 128 118
                   C 106 117 84 117 64 119 Z"
                fill="#FFFFFF" opacity="0.9" />

          <!-- Front LED Headlight Accent -->
          <path d="M 148 108 L 167 111 L 158 114 L 146 111 Z" fill="#FFFFFF" />
          <path d="M 152 109 L 165 111 L 157 113 Z" fill="url(#arrow-grad-dark)" />

          <!-- Grille Lines -->
          <path d="M 154 117 L 169 118" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
          <path d="M 152 121 L 167 121" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />

          <!-- Rear Wheel -->
          <ellipse cx="69" cy="120" rx="9" ry="12" fill="#0A0E17" stroke="#FFFFFF" stroke-width="2.5" />
          <ellipse cx="69" cy="120" rx="4.5" ry="6.5" fill="url(#arrow-grad-dark)" />

          <!-- Front Wheel -->
          <ellipse cx="129" cy="122" rx="11" ry="15" fill="#0A0E17" stroke="#FFFFFF" stroke-width="3" />
          <ellipse cx="129" cy="122" rx="5.5" ry="8" fill="url(#arrow-grad-dark)" />
        </svg>

        <!-- WEBSITE NAME (NOT REMOVED OR CHANGED) -->
        <div>
          <div class="brand-title">ORVEXA</div>
          <div class="brand-sub">CAR SUBSCRIPTION</div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
