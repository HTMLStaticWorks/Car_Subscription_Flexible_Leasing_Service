<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none" width="500" height="500">
  <defs>
    <linearGradient id="logo-org-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA020" />
      <stop offset="25%" stop-color="#FF6A00" />
      <stop offset="70%" stop-color="#F25000" />
      <stop offset="100%" stop-color="#D93800" />
    </linearGradient>
    <linearGradient id="logo-org-arrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E04000" />
      <stop offset="40%" stop-color="#FF6A00" />
      <stop offset="85%" stop-color="#FFA228" />
      <stop offset="100%" stop-color="#FFBF50" />
    </linearGradient>
    <linearGradient id="logo-org-key" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8E00" />
      <stop offset="60%" stop-color="#FF5700" />
      <stop offset="100%" stop-color="#D93800" />
    </linearGradient>
  </defs>

  <!-- 1. Circular Sweeping Arrow (Arching over car) -->
  <path d="M 85 305
           C 70 232 86 150 142 102
           C 194 55 268 48 332 74
           L 312 110
           L 374 165
           L 352 74
           L 332 108
           C 274 78 206 86 160 130
           C 112 176 100 240 114 300
           Z"
        fill="url(#logo-org-arrow)" />

  <!-- 2. Lower S-Loop Road Ribbon -->
  <path d="M 85 305
           C 74 365 106 430 166 456
           C 226 482 298 474 348 432
           C 388 398 392 355 356 336
           C 322 318 266 332 242 344
           C 285 342 334 336 352 355
           C 374 378 358 412 320 435
           C 272 464 204 466 150 436
           C 106 412 85 365 85 305 Z"
        fill="url(#logo-org-body)" />

  <!-- Solid White Crescent Accent along Lower Loop -->
  <path d="M 180 432
           C 236 452 296 444 340 405
           C 362 386 362 368 344 358
           C 326 348 290 354 262 362
           C 292 358 330 356 342 370
           C 356 386 344 406 315 422
           C 268 448 214 446 180 432 Z"
        fill="#FFFFFF" />

  <!-- 3. The Sports Car Body -->
  <path d="M 106 238
           C 116 198 154 162 206 156
           C 256 150 314 182 368 222
           C 384 234 392 248 386 260
           C 380 272 358 282 336 288
           C 292 298 238 294 192 288
           C 152 282 120 265 106 238 Z"
        fill="url(#logo-org-body)" />

  <!-- Solid White Cabin Windows -->
  <path d="M 152 206 C 168 180 198 174 204 174 L 204 206 Z" fill="#FFFFFF" />
  <path d="M 214 174 C 248 174 288 188 314 206 L 214 206 Z" fill="#FFFFFF" />
  <path d="M 172 170 C 206 160 252 160 292 178" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Solid White Headlights (LED Slit) -->
  <path d="M 264 236 L 332 246 L 302 256 L 258 246 Z" fill="#FFFFFF" />

  <!-- Solid White Grille Bars -->
  <path d="M 324 260 L 372 262" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 318 270 L 366 272" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 334 279 L 360 280" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- Muscular Rear Wheel Arch & White Wheel Ring -->
  <path d="M 104 246 C 104 220 134 220 138 248 L 138 276 C 126 278 104 272 104 246 Z" fill="#FFFFFF" />
  <ellipse cx="124" cy="264" rx="10" ry="16" fill="url(#logo-org-body)" />

  <!-- Muscular Front Wheel Arch & White Wheel Ring -->
  <path d="M 206 238 C 210 210 254 210 258 242 L 258 288 C 240 290 206 280 206 238 Z" fill="#FFFFFF" />
  <ellipse cx="236" cy="272" rx="13" ry="20" fill="url(#logo-org-body)" />

  <!-- Aerodynamic Lower Rocker / Contour (White) -->
  <path d="M 138 272 C 160 274 186 270 206 262" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 258 278 C 288 282 328 280 354 274" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- 4. The Car Key Fob & Key Blade -->
  <g transform="translate(140, 290) rotate(-22)">
    <rect x="0" y="20" width="115" height="65" rx="30" fill="url(#logo-org-key)" stroke="#FFFFFF" stroke-width="7" />
    <rect x="8" y="28" width="99" height="49" rx="22" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9" />

    <path d="M 50 44 C 50 34 65 34 65 44 L 65 49 L 50 49 Z" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    <rect x="43" y="49" width="29" height="21" rx="4.5" fill="#FFFFFF" />
    <circle cx="57.5" cy="58" r="2.5" fill="#D93800" />
    <path d="M 57.5 58 L 57.5 64" stroke="#D93800" stroke-width="2.2" stroke-linecap="round" />

    <path d="M 115 44
             L 190 44
             L 204 58
             L 186 58
             L 174 68
             L 160 58
             L 148 68
             L 134 58
             L 115 58 Z"
          fill="url(#logo-org-key)" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" />
    <line x1="120" y1="51" x2="182" y2="51" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>