<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <meta name="description" content="Login to your ORVEXA subscriber dashboard.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <style>
    /* Reset body background for auth pages */
    body { background-color: var(--color-bg); margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
    
    /* Auth Header with toggles */
    .auth-header {
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 100;
    }
    .auth-logo img { height: 32px; }
    
    /* Centered Card Layout */
    .auth-container {
      display: flex;
      flex: 1;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .auth-form-wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: center;
    }
    .auth-card {
      width: 100%;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 3rem;
      box-shadow: var(--shadow-sm);
      animation: fadeUp 0.6s ease-out;
      position: relative;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-title { font-family: var(--font-heading); font-size: 2rem; margin-bottom: 0.5rem; }
    .auth-subtitle { color: var(--color-text-muted); margin-bottom: 2.5rem; }

    /* Social Buttons */
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.875rem;
      border-radius: 4px;
      border: 1px solid var(--color-border);
      background: var(--color-bg);
      color: var(--color-text);
      font-weight: 500;
      cursor: pointer;
      transition: background var(--transition-fast);
      margin-bottom: 1rem;
    }
    .social-btn:hover { background: var(--color-surface-hover); }
    .social-btn svg { width: 20px; height: 20px; }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 2rem 0;
      color: var(--color-text-muted);
      font-size: 0.875rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--color-border);
    }
    .divider:not(:empty)::before { margin-right: .5em; }
    .divider:not(:empty)::after { margin-left: .5em; }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.875rem;
      margin-bottom: 2rem;
      flex-wrap: nowrap;
      gap: 1rem;
    }
    .form-options label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      color: var(--color-text-muted);
      white-space: nowrap;
    }
    .form-options a {
      color: var(--color-primary);
      font-weight: 500;
      white-space: nowrap;
    }

    .auth-footer { margin-top: 2rem; text-align: center; font-size: 0.875rem; color: var(--color-text-muted); }
    .auth-footer a { color: var(--color-primary); font-weight: 600; margin-left: 0.5rem; }

    @media (max-width: 768px) {
      .auth-form-wrapper { padding-top: 4.5rem; }
      .auth-header { background: var(--color-surface); box-shadow: var(--shadow-sm); }
    }
    @media (max-width: 600px) {
      .auth-card { padding: 2rem 1.5rem; }
      .form-options { flex-wrap: wrap; gap: 1rem; }
      .auth-footer { display: flex; flex-direction: column; gap: 0.5rem; white-space: normal; }
    }
  </style>
</head>
<body>
  <div style="position: absolute; top: 1.5rem; right: 2rem; display: flex; gap: 0.5rem; z-index: 100;">
    <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg></button>
    <button id="rtl-toggle" class="icon-btn" aria-label="Toggle RTL"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 9H3m14-4l4 4-4 4M3 15h18M7 11l-4 4 4 4"/></svg></button>
  </div>
  <div class="auth-container">
    <div class="auth-form-wrapper">
      <div class="auth-card">
        <div style="text-align: center; margin-bottom: 2rem;">
          <a href="index.html" style="display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 1rem; text-decoration: none;">
            <img src="assets/brand-mark.svg" alt="ORVEXA Logo" style="height: 32px;">
          </a>
          <h1 class="auth-title">Welcome Back</h1>
          <p class="auth-subtitle" style="margin-bottom:0;">Log in to manage your ORVEXA subscription.</p>
        </div>

        <form id="loginForm" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" class="form-control" required placeholder="name@example.com">
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-control" required placeholder="”¢”¢”¢”¢”¢”¢”¢”¢">
          </div>
          
          <div class="form-options">
            <label><input type="checkbox"> Remember me</label>
            <a href="#">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-full">Login</button>
        </form>

        <div class="divider">or continue with</div>

        <button class="social-btn">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/><path fill="none" d="M1 1h22v22H1z"/></svg>
          Continue with Google
        </button>
        <button class="social-btn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.09 2.31-.91 3.55-.92 1.6-.13 3.06.66 3.95 1.95-3.32 1.94-2.76 6.37.78 7.79-.8 2.04-1.94 3.97-3.36 5.35zm-5.11-13.8c-.14-1.87 1.4-3.66 3.41-3.81.33 1.97-1.57 3.74-3.41 3.81z"/></svg>
          Continue with Apple
        </button>

        <div class="auth-footer">
          Don't have an account? <a href="register.html">Register here</a>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
